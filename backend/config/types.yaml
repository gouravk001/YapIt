types:
  - name: payment
    version: 1
    description: >
      Use this type when the transcript records a financial transaction, debt, or
      reimbursement between people. Look for speech patterns like "I paid", "they owe
      me", "I owe", "lent", "borrowed", "split the bill", "cover me", "pay back",
      "reimburse", amounts in currency, and names of people involved in the exchange.
    fields:
      - name: person
        field_type: person
        required: true
        description: The other person involved in the payment or debt.
      - name: direction
        field_type: enum
        required: true
        description: >
          they_owe_me when the other person must pay the speaker ("Ravi owes me", "I lent
          Ravi", "Ravi will pay me back"). i_owe_them when the speaker must pay the other person
          ("I owe Ravi", "I have to give Ravi", "I borrowed from Ravi", "pay Ravi back").
        allowed_values:
          - they_owe_me
          - i_owe_them
        value_labels:
          they_owe_me: I will receive the money
          i_owe_them: I will give the money
      - name: amount
        field_type: money
        required: true
        description: The monetary amount involved in the transaction.
      - name: due_date
        field_type: date
        required: false
        description: The date by which the payment is expected to be settled.
      - name: note
        field_type: text
        required: false
        description: Optional context about what the payment is for.
    examples:
      - transcript: "I borrowed 2k from Sneha, I'll pay her back on Sunday."
        expected_fields:
          person: Sneha
          direction: i_owe_them
          amount: "₹2,000"
          due_date: Sunday
      - transcript: "Rohit owes me 1200 rupees for the movie tickets."
        expected_fields:
          person: Rohit
          direction: they_owe_me
          amount: "₹1,200"
          note: movie tickets
      - transcript: "Lent Vikram 50 thousand for his bike, he said he'll return it end of the month."
        expected_fields:
          person: Vikram
          direction: they_owe_me
          amount: "₹50,000"
          due_date: end of the month
          note: his bike

  - name: promise
    version: 1
    description: >
      Use this type when the transcript captures a commitment, obligation, or
      pledge — either made by the speaker or by someone else. Look for speech
      patterns like "I promised", "I said I would", "they said they'd", "I committed
      to", "I need to remember to tell them", "they're going to", "I told them I
      would", "don't let me forget I said". The key signal is an explicit or implied
      future action tied to a person.
    fields:
      - name: person
        field_type: person
        required: true
        description: >
          The other person in the promise: who the speaker promised something to, or who
          promised something to the speaker. Never the speaker themselves.
      - name: commitment
        field_type: text
        required: true
        description: A concise description of what was promised or committed to.
      - name: due_date
        field_type: date
        required: false
        description: The deadline or expected date for the commitment to be fulfilled.
    examples:
      - transcript: "I promised my boss I'd have the report done by end of week."
        expected_fields:
          person: my boss
          commitment: deliver the report
          due_date: end of this week
      - transcript: "Mark said he'd review my pull request tomorrow morning."
        expected_fields:
          person: Mark
          commitment: review the pull request
          due_date: tomorrow morning
      - transcript: "Don't let me forget I told Priya I'd help her move next Saturday."
        expected_fields:
          person: Priya
          commitment: help her move
          due_date: next Saturday

  - name: event
    version: 1
    description: >
      Use this type when the transcript describes something happening at a specific
      time or place — a meeting, gathering, appointment, party, call, or scheduled
      activity. Look for speech patterns like "there's a", "we're having", "meeting
      at", "party on", "appointment", "call scheduled for", "dinner tonight", "catch
      up on", specific dates and times, and mentions of location or attendees. The
      defining feature is a scheduled occurrence with a stated day or time; a task or
      errand without one (for example "buy milk on the way home") is general, not an event.
    fields:
      - name: title
        field_type: text
        required: true
        description: A short descriptive name or title for the event.
      - name: date
        field_type: date
        required: true
        description: The date the event takes place.
      - name: time
        field_type: text
        required: false
        description: The time the event starts, as mentioned in the transcript.
      - name: people
        field_type: list
        required: false
        description: People attending or involved in the event.
        item_type: person
    examples:
      - transcript: "Team standup is tomorrow at nine AM with the whole engineering squad."
        expected_fields:
          title: Team standup
          date: tomorrow
          time: "9:00 AM"
          people: [engineering squad]
      - transcript: "Birthday party for Emma on Saturday evening at her place."
        expected_fields:
          title: Emma's birthday party
          date: Saturday
          time: evening
          people: [Emma]
      - transcript: "I have a dentist appointment on the fourteenth at two thirty in the afternoon."
        expected_fields:
          title: Dentist appointment
          date: the 14th
          time: "2:30 PM"

  - name: info
    version: 1
    description: >
      Use this type when the transcript records a standalone fact, piece of
      knowledge, preference, or reference detail that the speaker wants to remember
      but that does not involve a transaction, commitment, or scheduled event. Look
      for patterns like "remember that", "note that", "FYI", "just so I know", "the
      answer is", "it's called", "the address is", "their number is", "I found out
      that", "turns out". No action or person is required — the value is purely
      informational.
    fields:
      - name: topic
        field_type: text
        required: true
        description: The subject or category of the information being noted.
      - name: details
        field_type: text
        required: false
        description: The full informational content to remember.
    examples:
      - transcript: "Note to self: the Wi-Fi password at the office is Sunshine2024 with a capital S."
        expected_fields:
          topic: Office Wi-Fi password
          details: "Sunshine2024 (capital S)"
      - transcript: "Just found out the API rate limit for that service is one thousand requests per hour."
        expected_fields:
          topic: API rate limit
          details: 1000 requests per hour
      - transcript: "Remember the parking on Oak Street is free after six PM on weekdays."
        expected_fields:
          topic: Parking on Oak Street
          details: Free after 6 PM on weekdays

  - name: general
    version: 1
    description: >
      Use this type as a catch-all fallback when the transcript does not clearly
      fit payment, promise, event, or info patterns. This includes to-dos, errands and
      shopping lists without a set day or time, vague reminders,
      mixed content, stream-of-consciousness notes, or anything ambiguous where
      forcing a specific type would lose meaning. If uncertain between general and
      another type, prefer the more specific type only when confident.
    fields:
      - name: content
        field_type: text
        required: true
        description: The full content of the note, preserved as faithfully as possible.
    examples:
      - transcript: "I don't know, just something about the project status and maybe following up with the team later."
        expected_fields:
          content: Something about the project status and potentially following up with the team later.
      - transcript: "Rambling note — need to buy groceries, also remember the thing about the budget and call mom."
        expected_fields:
          content: Need to buy groceries, review the budget, and call mom.
      - transcript: "Just a general thought — maybe we should reconsider the architecture before the next sprint."
        expected_fields:
          content: Consider reconsidering the architecture before the next sprint.
